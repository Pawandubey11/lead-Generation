version: "3.8"

services:
  leadgen:
    build: .
    image: leadgen-scraper:latest
    container_name: leadgen-scraper

    shm_size: '2gb'
    stdin_open: true
    tty: true

    volumes:
      - ./output:/app/output
      - ./config:/app/config:ro

    env_file:
      - .env

    environment:
      - LEADPULSE_DEV_MODE=true
      - MAX_BIZ_PER_CITY=20
      - MAX_LOCALITIES=30
      - MAX_BIZ_PER_LOCALITY=20

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: leadgen-dashboard:latest
    container_name: leadgen-dashboard

    volumes:
      - ./output:/app/output
      - ./config:/app/config:ro

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - LEADS_CSV_PATH=/app/output/final_ai_leads.csv
      - GOOGLE_COOKIES_PATH=/app/config/google_cookies.json
      - LEADPULSE_DEV_MODE=true
      - MAX_LOCALITIES=30
      - MAX_BIZ_PER_LOCALITY=20
      # AI Business Intelligence
      - AI_PROVIDER=openai
      - AI_MODEL=gpt-4o-mini
      - OPENAI_API_KEY=
      - GEMINI_API_KEY=
      - ANTHROPIC_API_KEY=

    restart: unless-stopped

    shm_size: '512m'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
